name: Test skip kubectl installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          install-kubectl: "no"
      - name: Assert helmfile is installed
        run: |
          which helmfile || { echo "FAIL: helmfile not found on PATH"; exit 1; }
          helmfile --version
          echo "PASS: helmfile is installed"
      - name: Assert helm is installed
        run: |
          which helm || { echo "FAIL: helm not found on PATH"; exit 1; }
          helm version --short
          echo "PASS: helm is installed"
      - name: Assert kubectl is NOT installed by this action
        run: |
          # kubectl may or may not be pre-installed on the runner; we just verify
          # the action didn't fail when skipping kubectl installation
          echo "PASS: action completed without installing kubectl"
