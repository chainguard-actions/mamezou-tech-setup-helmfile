name: Test helmfile arm64 arch alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-kubectl: "no"
          install-helm: "no"
          install-helm-plugins: "no"
          helmfile-version: v0.169.1
          helmfile-arch: aarch64
      - name: Assert arm64 helmfile binary installed
        run: |
          BIN="$HOME/bin/helmfile"
          [ -x "$BIN" ] || { echo "FAIL: $BIN missing or not executable"; exit 1; }
          MAGIC="$(head -c 4 "$BIN" | od -An -tx1 | tr -d ' \n')"
          MACHINE="$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')"
          echo "magic: $MAGIC machine: $MACHINE"
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF binary"; exit 1; }
          if [ "$MACHINE" != "b700" ]; then
            echo "FAIL: expected aarch64 (e_machine b700)"
            exit 1
          fi
          echo "PASS"
