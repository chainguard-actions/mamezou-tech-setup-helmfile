name: Test invalid helmfile arch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          install-kubectl: "no"
          install-helm: "no"
          install-helm-plugins: "no"
          helmfile-version: v0.169.1
          helmfile-arch: sparc
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported arch"
            exit 1
          fi
          if [ -e "$HOME/bin/helmfile" ]; then
            echo "FAIL: helmfile should not be installed"
            exit 1
          fi
          echo "PASS"
