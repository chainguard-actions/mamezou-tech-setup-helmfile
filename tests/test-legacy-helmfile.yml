name: Test legacy (roboll) helmfile version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-kubectl: "no"
          install-helm: "no"
          install-helm-plugins: "no"
          helmfile-version: v0.144.0
      - name: Assert legacy helmfile installed
        run: |
          if [ ! -x "$HOME/bin/helmfile" ]; then
            echo "FAIL: helmfile not installed"
            exit 1
          fi
          OUT="$("$HOME/bin/helmfile" --version 2>&1 || true)"
          echo "helmfile: $OUT"
          echo "$OUT" | grep -q "0.144.0" || { echo "FAIL: expected helmfile v0.144.0"; exit 1; }
          echo "PASS"
