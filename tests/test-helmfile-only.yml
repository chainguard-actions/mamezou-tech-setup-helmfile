name: Test helmfile only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-kubectl: "no"
          install-helm: "no"
          install-helm-plugins: "no"
          helmfile-version: v0.169.1
          helmfile-arch: amd64
      - name: Assert helmfile installed with requested version
        run: |
          which helmfile || { echo "FAIL: helmfile not on PATH"; exit 1; }
          OUT="$(helmfile --version 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "0.169.1"; then
            echo "FAIL: expected version 0.169.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert helm and kubectl were not installed into ~/bin
        run: |
          if [ -e "$HOME/bin/helm" ] || [ -e "$HOME/bin/kubectl" ]; then
            echo "FAIL: helm/kubectl should not be installed"
            ls -la "$HOME/bin"
            exit 1
          fi
          echo "PASS"
