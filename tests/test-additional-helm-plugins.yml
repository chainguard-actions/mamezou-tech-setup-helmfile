name: Test additional-helm-plugins input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-kubectl: "no"
          install-helm: "yes"
          install-helm-plugins: "yes"
          helmfile-version: "v1.2.3"
          additional-helm-plugins: "https://github.com/helm/helm-mapkubeapis"
      - name: Assert helmfile is installed
        run: |
          if ! command -v helmfile &>/dev/null; then
            echo "FAIL: helmfile not found in PATH"
            exit 1
          fi
          echo "PASS: helmfile is installed: $(helmfile --version)"
      - name: Assert helm is installed
        run: |
          if ! command -v helm &>/dev/null; then
            echo "FAIL: helm not found in PATH"
            exit 1
          fi
          echo "PASS: helm is installed: $(helm version --short)"
      - name: Assert additional helm plugin is installed
        run: |
          PLUGINS="$(helm plugin list 2>/dev/null || true)"
          echo "Installed plugins: $PLUGINS"
          if echo "$PLUGINS" | grep -qi "mapkubeapis"; then
            echo "PASS: mapkubeapis plugin is installed"
          else
            echo "FAIL: expected mapkubeapis plugin to be installed"
            exit 1
          fi
